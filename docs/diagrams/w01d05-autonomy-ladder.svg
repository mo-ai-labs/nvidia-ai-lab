<svg xmlns="http://www.w3.org/2000/svg" viewBox="44 -50 697.2 490" font-family="Segoe Print, Comic Sans MS, Virgil, sans-serif"><rect x="44" y="-50" width="697.2" height="490" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><text x="200" y="-15.120000000000001" font-size="24" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">Autonomy ladder: AML agent</text><polyline points="120,420 120,60" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><text x="64" y="39.92" font-size="16" fill="#757575" text-anchor="start" dominant-baseline="central">More autonomy</text><rect x="160" y="60" width="420" height="70" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="370.0" y="85.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">4. Fully autonomous</text><text x="370.0" y="105.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Auto-close audited false positives, QA sampled</text><rect x="160" y="150" width="420" height="70" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="370.0" y="175.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">3. Act and report</text><text x="370.0" y="195.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Enrich alerts (KYC, history), log every call</text><text x="598" y="127.91999999999999" font-size="16" fill="#6d28d9" text-anchor="start" dominant-baseline="central">Human reviews</text><text x="598" y="147.92" font-size="16" fill="#6d28d9" text-anchor="start" dominant-baseline="central">after the fact</text><polyline points="150,240 590,240" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 6"/><text x="598" y="227.92" font-size="16" fill="#b91c1c" text-anchor="start" dominant-baseline="central">SAR ceiling:</text><text x="598" y="247.92" font-size="16" fill="#b91c1c" text-anchor="start" dominant-baseline="central">never above</text><rect x="160" y="260" width="420" height="70" rx="12" fill="#c3fae8" stroke="#0e7490" stroke-width="2"/><text x="370.0" y="285.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">2. Act with approval  [interrupt() gate]</text><text x="370.0" y="305.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Draft SAR -&gt; pause -&gt; analyst approves -&gt; file</text><rect x="160" y="350" width="420" height="70" rx="12" fill="#c3fae8" stroke="#0e7490" stroke-width="2"/><text x="370.0" y="375.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">1. Suggest</text><text x="370.0" y="395.0" font-size="16" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Propose typology + next steps; human acts</text><text x="598" y="327.92" font-size="16" fill="#0e7490" text-anchor="start" dominant-baseline="central">Human decides</text><text x="598" y="347.92" font-size="16" fill="#0e7490" text-anchor="start" dominant-baseline="central">before action</text></svg>