<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 1175 622.5" font-family="Segoe Print, Comic Sans MS, Virgil, sans-serif"><rect x="-10" y="-5" width="1175" height="622.5" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><text x="20" y="28.64" font-size="22" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">GH-600 (Copilot)</text><text x="285" y="28.64" font-size="22" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">Runtime agent</text><text x="595" y="28.64" font-size="22" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">Google ADK</text><text x="860" y="28.64" font-size="22" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">Claude API / Agent SDK</text><rect x="10" y="70" width="200" height="64" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="110.0" y="90.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Auto-merge</text><text x="110.0" y="113.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">on low risk</text><rect x="260" y="70" width="210" height="64" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="365.0" y="102.0" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">4. Fully autonomous</text><rect x="520" y="70" width="270" height="64" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="655.0" y="90.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">No confirmation, or</text><text x="655.0" y="113.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">require_confirmation=fn</text><rect x="840" y="70" width="290" height="64" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/><text x="985.0" y="90.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">bypassPermissions</text><text x="985.0" y="113.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">(hooks + deny still apply)</text><polyline points="210,102 260,102" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="470,102 520,102" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="790,102 840,102" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><rect x="260" y="170" width="210" height="64" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/><text x="365.0" y="190.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">3. Act and report</text><text x="365.0" y="213.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">(no GH-600 rung)</text><rect x="520" y="170" width="270" height="64" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="655.0" y="190.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Tools run freely +</text><text x="655.0" y="213.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">after_tool_callback, trace</text><rect x="840" y="170" width="290" height="64" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/><text x="985.0" y="190.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">allowed_tools / acceptEdits</text><text x="985.0" y="213.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">+ PostToolUse hook log</text><polyline points="470,202 520,202" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="790,202 840,202" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><rect x="10" y="210" width="200" height="64" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="110.0" y="242.0" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">PR with checks</text><rect x="260" y="270" width="210" height="64" rx="12" fill="#c3fae8" stroke="#0e7490" stroke-width="2"/><text x="365.0" y="302.0" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">2. Act with approval</text><rect x="520" y="270" width="270" height="64" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="655.0" y="290.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">require_confirmation=True</text><text x="655.0" y="313.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">request_confirmation()</text><rect x="840" y="270" width="290" height="64" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/><text x="985.0" y="290.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">canUseTool callback /</text><text x="985.0" y="313.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">hold tool_use for approval</text><rect x="10" y="310" width="200" height="64" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="110.0" y="342.0" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Draft PR</text><polyline points="210,242 260,296" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="210,342 260,308" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="470,302 520,302" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="790,302 840,302" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><rect x="260" y="370" width="210" height="64" rx="12" fill="#c3fae8" stroke="#0e7490" stroke-width="2"/><text x="365.0" y="402.0" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">1. Suggest</text><rect x="520" y="370" width="270" height="64" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/><text x="655.0" y="390.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Read-only tools /</text><text x="655.0" y="413.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">output_schema only</text><rect x="840" y="370" width="290" height="64" rx="12" fill="#eebefa" stroke="#ec4899" stroke-width="2"/><text x="985.0" y="390.75" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">plan mode /</text><text x="985.0" y="413.25" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">tool_choice: none</text><rect x="10" y="410" width="200" height="64" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/><text x="110.0" y="442.0" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central">Suggest</text><polyline points="210,442 260,402" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="470,402 520,402" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="790,402 840,402" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#ah)"/><polyline points="1145,302 1145,102" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="10" y="521.16" font-size="18" fill="#1e1e1e" text-anchor="start" dominant-baseline="central">&quot;PR with checks&quot; = rung 2 + checks gate  (ADK: before_tool_callback · Claude: PreToolUse hook / deny rules)</text><text x="10" y="556.16" font-size="18" fill="#b91c1c" text-anchor="start" dominant-baseline="central">Red dashed: jump from rung 2 -&gt; 4 with one setting</text><text x="10" y="586.16" font-size="18" fill="#b91c1c" text-anchor="start" dominant-baseline="central">GH: bypass actor · ADK: drop require_confirmation · Claude: switch to bypassPermissions</text></svg>